<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical Title & Description (Requirement 12) -->
    <title>ScamShield — AI-Powered Scam Detection &amp; Protection</title>
    <meta
      name="description"
      content="ScamShield is an intelligent cybersecurity assistant using multimodal neural AI to analyze suspicious text, screenshots, and URLs, unmasking deceptive tactics and protecting your family."
    />
    <meta name="keywords" content="scam detection, phishing protection, fraud prevention, URL scanner, screenshot analysis, cybersecurity, family protection" />
    <meta name="author" content="ScamShield Security Operations" />
    <meta name="theme-color" content="#0B0B0B" />

    <!-- Favicon & Touch Icons (Requirement 16) -->
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <link rel="apple-touch-icon" href="/shield.svg" />

    <!-- Open Graph Social Metadata (Requirement 14) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScamShield" />
    <meta property="og:title" content="ScamShield — AI-Powered Scam Detection &amp; Protection" />
    <meta
      property="og:description"
      content="Detect deceptive messages, banking phishing, and malicious links in real time with neural AI forensics."
    />
    <meta property="og:image" content="https://scam-shield-kohl-phi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ScamShield AI-Powered Scam Detection and Protection Banner" />
    <meta property="og:url" content="https://scam-shield-kohl-phi.vercel.app" />

    <!-- Twitter Card Metadata (Requirement 14) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScamShield — AI-Powered Scam Detection &amp; Protection" />
    <meta
      name="twitter:description"
      content="Detect deceptive messages, banking phishing, and malicious links in real time with neural AI forensics."
    />
    <meta name="twitter:image" content="https://scam-shield-kohl-phi.vercel.app/og-image.png" />

    <!-- Google Fonts: Playfair Display (Serif Brand), Manrope (Clean Body/UI), JetBrains Mono (Diagnostics/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="bg-color-black text-on-surface font-body antialiased selection:bg-color-crimson selection:text-color-offwhite min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
